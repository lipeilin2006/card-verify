[package]
name = "card-verify-sdk"
version = "0.1.0"
edition = "2024"

[features]
# VMProtect 标记开关（no-op 与链接由 build.rs / vmp.rs 按 cfg 控制）。
vmp = []

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
ed25519-dalek = "2"
hex = "0.4"
machine-uid = "0.5"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
